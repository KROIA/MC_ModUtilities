# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Dev-only code (sandbox and tests). false = release: those packages are not compiled.
enable_dev_features = false

# Mod properties
mod_version = 1.21.1-2.2.1
maven_group = net.kroia
archives_name = modutilities
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.1
yarn_mappings = 1.21.1+build.1
mapping_version=2024.11.17

# Dependencies
architectury_api_version = 13.0.8
# TestKit (dev-only test framework mod), read from its build/libs: compile-only in dev builds, dev runtime with -Pwith_testkit=true
testkit_version = 1.21.1-0.1.0
fabric_loader_version = 0.16.9
fabric_api_version = 0.114.0+1.21.1
neoforge_version = 21.1.84
yarn_mappings_patch_neoforge_version = 1.21+build.4
jei_version = 19.27.0.336
jei_minecraft_version = 1.21.1
placeholder_api_version = 2.4.2+1.21
# 0.3.1 is the last release built for MC <= 1.21.1 (0.3.2+ target 1.21.2+)
fabric_permissions_api_version = 0.3.1
# LuckPerms API (compileOnly, Maven Central). Works with any LuckPerms 5.4+ at runtime.
luckperms_api_version = 5.4
# LuckPerms mod for dev runs only (opt-in: -Pwith_luckperms=true), Modrinth Maven version numbers.
luckperms_fabric_version = v5.4.140-fabric
# NeoForge: 5.4.140 (the last build tagged 1.21.1) kicks every joining player ("Capability has not been initialised",
# LuckPerms #3963/#4048). 5.4.149 (tagged 1.21.3) is the oldest build with the fix (b18717e) and runs on 1.21.1.
luckperms_neoforge_version = v5.4.149-neoforge
#quilt_loader_version = 0.28.0-beta.4
#quilted_fabric_api_version = 11.0.0-alpha.3+0.100.7-1.21
