# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Dev-only code (sandbox, unit tests, autotest). false = release: those packages are not compiled.
enable_dev_features = false

# Mod properties
mod_version = 1.21.4-2.2.0
maven_group = net.kroia
archives_name = modutilities
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.4
yarn_mappings = 1.21.4+build.8
mapping_version=2025.03.23

# Dependencies
architectury_api_version = 15.0.3
fabric_loader_version = 0.16.14
fabric_api_version = 0.119.4+1.21.4
neoforge_version = 21.4.161
yarn_mappings_patch_neoforge_version = 1.21+build.4
jei_version = 20.0.0.4
# JEI 1.21.4 exists for NeoForge/common only (no Fabric build); fabric/build.gradle uses the common API jar.
jei_minecraft_version = 1.21.4
# TODO(1.21.4 port): no Placeholder API build for 1.21.4 (2.5.2+1.21.3, then 2.6.x+1.21.5); compile-only against the 1.21.3 build.
placeholder_api_version = 2.5.2+1.21.3
