# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Dev-only code (sandbox and tests). false = release: those packages are not compiled.
enable_dev_features = false

# Mod properties
mod_version = 1.21.7-2.2.2
maven_group = net.kroia
archives_name = modutilities
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.7
yarn_mappings = 1.21.7+build.8
mapping_version=2025.07.18

# Dependencies
architectury_api_version = 17.0.8
fabric_loader_version = 0.16.14
fabric_api_version = 0.129.0+1.21.7
neoforge_version = 21.7.25-beta
# TestKit (dev-only test framework mod), read from its build/libs: compile-only in dev builds, dev runtime with -Pwith_testkit=true
testkit_version = 1.21.7-0.1.0
yarn_mappings_patch_neoforge_version = 1.21+build.4
jei_version = 23.1.0.8
jei_minecraft_version = 1.21.7
placeholder_api_version = 2.7.2+1.21.8
# 0.4.0+ target MC 1.21.6+ (0.3.1 is the last release built for MC <= 1.21.1)
fabric_permissions_api_version = 0.4.1
# LuckPerms API (compileOnly, Maven Central). Works with any LuckPerms 5.4+ at runtime.
luckperms_api_version = 5.4
# LuckPerms mod for dev runs only (opt-in: -Pwith_luckperms=true), Modrinth Maven version numbers.
luckperms_fabric_version = v5.5.10-fabric
# LuckPerms builds tagged for MC 1.21.7.
luckperms_neoforge_version = v5.5.10-neoforge
