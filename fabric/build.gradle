plugins {
    id 'com.github.johnrengelman.shadow'
}

repositories {
    maven {
        // Jared's maven hosts JEI since January 2023.
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // Patbox Text Placeholder API
    maven { url = "https://maven.nucleoid.xyz/" }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // JEI Fabric API (compile-only) + dev-runtime JEI. JEI stays a soft
    // dependency of the shipped mod, but the Architectury platform transformer
    // walks class frames on launch and must resolve every referenced JEI type
    // (IJeiRuntime, IIngredientListOverlay, ...) even though we never call
    // them without JEI present. Without modRuntimeOnly, runClient crashes
    // with "TypeNotPresentException: Type mezz/jei/... not present" the first
    // time ModUtilitiesJeiPlugin is touched during transform.
    modCompileOnlyApi("mezz.jei:jei-${rootProject.jei_minecraft_version}-fabric-api:${rootProject.jei_version}")
    // JEI dev runtime: full mod jar where JEI exists for this MC version, otherwise the API jar satisfies the transformer.
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-fabric:${rootProject.jei_version}") // mc<=1.21.1
    modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-fabric-api:${rootProject.jei_version}") // mc>=1.21.2

    // Patbox Text Placeholder API - compile-only soft dependency, never bundled.
    // PlaceholderApiBackend is only class-loaded when "placeholder-api" is present.
    modCompileOnly("eu.pb4:placeholder-api:${rootProject.placeholder_api_version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
