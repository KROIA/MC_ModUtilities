architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    mavenCentral()
    maven {
        // Jared's maven hosts JEI since January 2023.
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // NEZNAMY TAB API (https://github.com/NEZNAMY/TAB-API)
    maven { url 'https://jitpack.io' }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version" // mc<=1.21.11
    //implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version" // mc>=26.1 (no remapping, so no mod* configurations)

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version" // mc<=1.21.11
    //implementation "dev.architectury:architectury:$rootProject.architectury_api_version" // mc>=26.1

    // JEI common API — compileOnly so JEI stays a soft dependency. The
    // ModUtilitiesJeiPlugin is only class-loaded when JEI is present
    // (annotation scan on NeoForge, jei_mod_plugin entrypoint on Fabric).
    compileOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-common-api:${rootProject.jei_version}")

    // NEZNAMY TAB API - compileOnly soft dependency. TabPlaceholderBackend is only
    // class-loaded when the "tab" mod is present (see ModUtilitiesMod.init).
    compileOnly 'com.github.NEZNAMY:TAB-API:5.5.0'

    // LuckPerms API (Maven Central) - compileOnly soft dependency, never bundled. Plain Java API, so no
    // remapping. Only LuckPermsBridge.Lp references it, and that class loads only when LuckPerms is present.
    compileOnly "net.luckperms:api:${rootProject.luckperms_api_version}"

    // Offline unit tests (Task #98): testing.OfflineTests maps TestSuites to JUnit DynamicTests. compileOnly in main
    // because that class ships in dev jars for dependent mods; they bring JUnit themselves on their test classpath.
    compileOnly "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

// `gradlew :common:test` runs the TestSuites that need no game (TestSuite.needsGame() == false).
// Release mode (enable_dev_features=false) keeps testing/** and sandbox/** out of main, so the test source set compiles
// them itself; the include patterns also cover src/test/java, whose classes therefore live in the testing package.
if (!(rootProject.findProperty('enable_dev_features') ?: 'false').toBoolean()) {
    sourceSets.test.java {
        srcDir 'src/main/java'
        include 'net/kroia/modutilities/testing/**', 'net/kroia/modutilities/sandbox/**'
    }
    configurations.testCompileOnly.extendsFrom configurations.compileOnly // LuckPerms/JEI/TAB APIs the tests import
}

test {
    useJUnitPlatform()
    workingDir = temporaryDir // Minecraft's log4j config writes logs/latest.log into the working directory
}
