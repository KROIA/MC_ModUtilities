architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        // Jared's maven hosts JEI since January 2023.
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // NEZNAMY TAB API (https://github.com/NEZNAMY/TAB-API)
    maven { url 'https://jitpack.io' }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version" // mc<=1.21.11
    //implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version" // mc>=26.1 (no remapping, so no mod* configurations)

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version" // mc<=1.21.11
    //implementation "dev.architectury:architectury:$rootProject.architectury_api_version" // mc>=26.1

    // JEI common API — compileOnly so JEI stays a soft dependency. The
    // ModUtilitiesJeiPlugin is only class-loaded when JEI is present
    // (annotation scan on NeoForge, jei_mod_plugin entrypoint on Fabric).
    compileOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-common-api:${rootProject.jei_version}")

    // NEZNAMY TAB API - compileOnly soft dependency. TabPlaceholderBackend is only
    // class-loaded when the "tab" mod is present (see ModUtilitiesMod.init).
    compileOnly 'com.github.NEZNAMY:TAB-API:5.5.0'
}
