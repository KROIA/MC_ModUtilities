plugins {
    id 'com.github.johnrengelman.shadow' // mc<=1.21.11
    //id 'com.gradleup.shadow' // mc>=26.1
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        // Jared's maven hosts JEI since January 2023.
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version" // mc<=1.21.11
    //implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version" // mc>=26.1

    common(project(path: ':common', configuration: 'namedElements')) { transitive false } // mc<=1.21.11
    //common(project(path: ':common')) { transitive false } // mc>=26.1
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Dev-runtime JEI (matches fabric/build.gradle rationale). The
    // Architectury platform transformer needs to resolve JEI types referenced
    // by ModUtilitiesJeiPlugin during frame merging or runClient crashes with
    // "TypeNotPresentException: Type mezz/jei/... not present". JEI is still a
    // soft dependency of the shipped mod — this line only affects dev.
    // JEI dev runtime: full mod jar where JEI exists for this MC version, otherwise the API jar satisfies the transformer.
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge:${rootProject.jei_version}") // mc<=1.21.1
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge-api:${rootProject.jei_version}") // mc>=1.21.2 mc<=1.21.3
    modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge:${rootProject.jei_version}") // mc>=1.21.4 mc<=1.21.5
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge-api:${rootProject.jei_version}") // mc>=1.21.6 mc<=1.21.6 (no JEI build for 1.21.6; API jar satisfies the transformer)
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge:${rootProject.jei_version}") // mc>=1.21.7 mc<=1.21.11
    //runtimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge:${rootProject.jei_version}") // mc>=26.1
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow' // mc<=1.21.11
    //archiveClassifier = null // mc>=26.1 (no remapJar; the shadow jar is the release jar)
}

remapJar { // mc<=1.21.11
    inputFile.set shadowJar.archiveFile // mc<=1.21.11
} // mc<=1.21.11
//jar { // mc>=26.1
    //archiveClassifier = 'raw' // mc>=26.1
//} // mc>=26.1
